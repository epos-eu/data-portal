name: 'mirror'
on:
  push:
    branches:
      - update

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          git remote add remote-repo https://github:${{secrets.GITLAB}}@epos-ci.brgm.fr/epos/epos-gui.git
          git fetch --unshallow
          git checkout -b opensource-patch
          git push remote-repo opensource-patch
